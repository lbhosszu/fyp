<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">System Architecture</text>

  <!-- ═══════════════ LAYER 1: External Data ═══════════════ -->
  <rect x="30" y="52" width="840" height="80" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="46" y="70" font-size="11" fill="#64748b" font-weight="bold">EXTERNAL DATA SOURCE</text>

  <!-- FastF1 API -->
  <rect x="320" y="76" width="260" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="450" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">FastF1 Python API</text>

  <!-- ═══════════════ LAYER 2: Data Pipeline ═══════════════ -->
  <rect x="30" y="152" width="840" height="136" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="46" y="170" font-size="11" fill="#64748b" font-weight="bold">DATA PIPELINE</text>

  <!-- extract_year.py -->
  <rect x="140" y="184" width="180" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">extract_year.py</text>
  <text x="230" y="218" text-anchor="middle" font-size="10" fill="#3b82f6">Data extraction + retry</text>

  <!-- Raw CSVs -->
  <rect x="385" y="184" width="130" height="42" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="204" text-anchor="middle" font-size="11" fill="#475569">raw_results_</text>
  <text x="450" y="218" text-anchor="middle" font-size="11" fill="#475569">2018–2024.csv</text>

  <!-- build_dataset.py -->
  <rect x="580" y="184" width="180" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="670" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">build_dataset.py</text>
  <text x="670" y="218" text-anchor="middle" font-size="10" fill="#3b82f6">Rolling-window features</text>

  <!-- dataset_with_features.csv -->
  <rect x="345" y="244" width="210" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">dataset_with_features.csv</text>

  <!-- Arrows: FastF1 → extract -->
  <line x1="450" y1="118" x2="450" y2="140" stroke="#444" stroke-width="1.5"/>
  <line x1="450" y1="140" x2="230" y2="140" stroke="#444" stroke-width="1.5"/>
  <line x1="230" y1="140" x2="230" y2="184" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- extract → raw CSVs -->
  <line x1="320" y1="205" x2="385" y2="205" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- raw CSVs → build_dataset -->
  <line x1="515" y1="205" x2="580" y2="205" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- build_dataset → dataset -->
  <line x1="670" y1="226" x2="670" y2="260" stroke="#444" stroke-width="1.5"/>
  <line x1="670" y1="260" x2="555" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════ LAYER 3: ML Training ═══════════════ -->
  <rect x="30" y="300" width="400" height="120" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="46" y="318" font-size="11" fill="#64748b" font-weight="bold">MODEL TRAINING</text>

  <!-- train_models.py -->
  <rect x="56" y="332" width="170" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="141" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">train_models.py</text>
  <text x="141" y="366" text-anchor="middle" font-size="10" fill="#3b82f6">LR / RF / GB training</text>

  <!-- .joblib models -->
  <rect x="270" y="332" width="140" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">rf_top*.joblib</text>
  <text x="340" y="366" text-anchor="middle" font-size="10" fill="#92400e">(9 model files)</text>

  <!-- dataset → train_models -->
  <line x1="400" y1="276" x2="400" y2="295" stroke="#444" stroke-width="1.5"/>
  <line x1="400" y1="295" x2="141" y2="295" stroke="#444" stroke-width="1.5"/>
  <line x1="141" y1="295" x2="141" y2="332" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- train → models -->
  <line x1="226" y1="353" x2="270" y2="353" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════ LAYER 3b: Evaluation ═══════════════ -->
  <rect x="460" y="300" width="410" height="120" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="476" y="318" font-size="11" fill="#64748b" font-weight="bold">EVALUATION</text>

  <!-- evaluate_models.py -->
  <rect x="480" y="332" width="170" height="42" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="565" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">evaluate_models.py</text>
  <text x="565" y="366" text-anchor="middle" font-size="10" fill="#6366f1">Metrics + plots</text>

  <!-- ablation + rolling -->
  <rect x="670" y="332" width="180" height="42" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="760" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">ablation_study.py</text>
  <text x="760" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">rolling_cv.py</text>

  <!-- evaluation/ output -->
  <rect x="570" y="388" width="180" height="24" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="660" y="405" text-anchor="middle" font-size="11" fill="#475569">evaluation/ (PNG + CSV)</text>

  <!-- dataset → evaluate -->
  <line x1="500" y1="276" x2="500" y2="295" stroke="#444" stroke-width="1.5"/>
  <line x1="500" y1="295" x2="565" y2="295" stroke="#444" stroke-width="1.5"/>
  <line x1="565" y1="295" x2="565" y2="332" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dataset → rolling/ablation -->
  <line x1="565" y1="295" x2="760" y2="295" stroke="#444" stroke-width="1.5"/>
  <line x1="760" y1="295" x2="760" y2="332" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- evaluate → output -->
  <line x1="565" y1="374" x2="565" y2="400" stroke="#444" stroke-width="1"/>
  <line x1="565" y1="400" x2="570" y2="400" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════ LAYER 4: Web Application ═══════════════ -->
  <rect x="30" y="440" width="620" height="120" rx="6" fill="none" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="46" y="458" font-size="11" fill="#64748b" font-weight="bold">WEB APPLICATION (Streamlit)</text>

  <!-- app.py -->
  <rect x="56" y="472" width="200" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="156" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">app.py</text>
  <text x="156" y="512" text-anchor="middle" font-size="10" fill="#16a34a">UI, game logic, scoring,</text>
  <text x="156" y="524" text-anchor="middle" font-size="10" fill="#16a34a">session state management</text>

  <!-- fastf1_service.py -->
  <rect x="290" y="472" width="170" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">fastf1_service.py</text>
  <text x="375" y="506" text-anchor="middle" font-size="10" fill="#16a34a">Live race summaries</text>

  <!-- predict_api.py -->
  <rect x="290" y="524" width="170" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">predict_api.py</text>

  <!-- track_layouts/ -->
  <rect x="500" y="472" width="130" height="42" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="565" y="492" text-anchor="middle" font-size="11" fill="#475569">track_layouts/</text>
  <text x="565" y="506" text-anchor="middle" font-size="10" fill="#94a3b8">PNG images</text>

  <!-- app → fastf1_service -->
  <line x1="256" y1="493" x2="290" y2="493" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- app → predict_api -->
  <line x1="256" y1="520" x2="270" y2="520" stroke="#16a34a" stroke-width="1"/>
  <line x1="270" y1="520" x2="270" y2="539" stroke="#16a34a" stroke-width="1"/>
  <line x1="270" y1="539" x2="290" y2="539" stroke="#16a34a" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- app → track_layouts -->
  <line x1="256" y1="500" x2="276" y2="500" stroke="#94a3b8" stroke-width="1"/>
  <line x1="276" y1="500" x2="276" y2="470" stroke="#94a3b8" stroke-width="1"/>
  <line x1="276" y1="470" x2="490" y2="470" stroke="#94a3b8" stroke-width="1"/>
  <line x1="490" y1="470" x2="490" y2="493" stroke="#94a3b8" stroke-width="1"/>
  <line x1="490" y1="493" x2="500" y2="493" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- fastf1_service → FastF1 API (runtime) -->
  <line x1="375" y1="472" x2="375" y2="140" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="375" y1="140" x2="390" y2="118" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <text x="382" y="148" font-size="9" fill="#0284c7">runtime</text>

  <!-- models → app (loads at runtime) -->
  <line x1="340" y1="374" x2="340" y2="430" stroke="#444" stroke-width="1.5"/>
  <line x1="340" y1="430" x2="156" y2="430" stroke="#444" stroke-width="1.5"/>
  <line x1="156" y1="430" x2="156" y2="472" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="425" font-size="9" fill="#64748b">loads models</text>

  <!-- dataset → app (loads at startup) -->
  <line x1="450" y1="276" x2="450" y2="285" stroke="#444" stroke-width="1.5"/>
  <line x1="450" y1="285" x2="80" y2="285" stroke="#444" stroke-width="1.5"/>
  <line x1="80" y1="285" x2="80" y2="472" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="86" y="380" font-size="9" fill="#64748b" transform="rotate(90, 86, 380)">loads dataset</text>

  <!-- ═══════════════ LAYER 5: User ═══════════════ -->
  <rect x="700" y="458" width="160" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="780" y="500" text-anchor="middle" font-size="28" fill="#475569">&#x1F3CE;</text>
  <text x="780" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">User</text>
  <text x="780" y="540" text-anchor="middle" font-size="10" fill="#64748b">Web browser</text>

  <!-- app ↔ user -->
  <line x1="650" y1="508" x2="700" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="675" y="500" text-anchor="middle" font-size="9" fill="#64748b">HTTP</text>

  <!-- Legend -->
  <rect x="30" y="580" width="840" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="46" y="588" width="16" height="14" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="68" y="600" font-size="10" fill="#475569">Python script</text>
  <rect x="160" y="588" width="16" height="14" rx="2" fill="#dcfce7" stroke="#16a34a"/>
  <text x="182" y="600" font-size="10" fill="#475569">App module</text>
  <rect x="260" y="588" width="16" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="282" y="600" font-size="10" fill="#475569">Data artefact</text>
  <rect x="370" y="588" width="16" height="14" rx="2" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="392" y="600" font-size="10" fill="#475569">Evaluation script</text>
  <line x1="510" y1="595" x2="540" y2="595" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="546" y="600" font-size="10" fill="#475569">Data flow</text>
  <line x1="620" y1="595" x2="650" y2="595" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="656" y="600" font-size="10" fill="#475569">Runtime API call</text>
</svg>
